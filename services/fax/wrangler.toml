name = "fax-service"
account_id = "ccbc9926d08a298aee2a4f0cffcfc4a3"
main = "src/fax.js"
compatibility_date = "2025-07-04"
compatibility_flags = ["nodejs_compat"]
send_metrics = true
minify = false
workers_dev = false

[observability]
enabled = true

# R2 bucket binding for file storage (required for Telnyx provider)
[[r2_buckets]]
binding = "FAX_FILES_BUCKET"
bucket_name = "fax-files"
preview_bucket_name = "fax-files-preview"

[env.staging]
name = "fax-service-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "DEBUG"
FAX_FILES_BUCKET_PUBLIC_URL = "https://r2-staging.sendfax.pro"
TELNYX_CONNECTION_ID = "2740858224415605884"
TELNYX_SENDER_ID = "+18334610414"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
TELNYX_ENABLE_FILE_CONVERSION = "false"
CONVERTER_TIMEOUT_MS = "12000"
TELNYX_MAX_CONVERSION_FILES = "10"

[[env.staging.services]]
binding = "CONVERTER_SERVICE"
service = "converter-service"

[[env.staging.r2_buckets]]
binding = "FAX_FILES_BUCKET"
bucket_name = "fax-files-staging"
preview_bucket_name = "fax-files-staging-preview"

[env.prod]
name = "fax-service-prod" 
minify = true

[env.prod.observability]
enabled = true
head_sampling_rate = 1

[env.prod.vars]
ENVIRONMENT = "prod"
LOG_LEVEL = "DEBUG"
FAX_FILES_BUCKET_PUBLIC_URL = "https://r2.sendfax.pro"
TELNYX_CONNECTION_ID = "2740858224415605884"
TELNYX_SENDER_ID = "+18334610414"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
TELNYX_ENABLE_FILE_CONVERSION = "false"
CONVERTER_TIMEOUT_MS = "12000"
TELNYX_MAX_CONVERSION_FILES = "10"

[[env.prod.services]]
binding = "CONVERTER_SERVICE"
service = "converter-service"

[[env.prod.r2_buckets]]
binding = "FAX_FILES_BUCKET"
bucket_name = "fax-files-prod"
preview_bucket_name = "fax-files-prod-preview"
