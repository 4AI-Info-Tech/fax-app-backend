SUPABASE_URL = "https://qgzzpufyjczgvvggvrhh.supabase.co"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
AI_FORM_FREE_COMPLETIONS = "1"
OPENAI_MODEL = "gpt-4.1-mini"
