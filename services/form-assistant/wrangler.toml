name = "form-assistant-service"
main = "src/form-assistant.js"
compatibility_date = "2025-07-04"
compatibility_flags = ["nodejs_compat"]
send_metrics = true
minify = false
workers_dev = false

[observability]
enabled = true

[vars]
AI_FORM_FREE_COMPLETIONS = "1"

[env.staging]
name = "form-assistant-service-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
ENVIRONMENT = "staging"
SUPABASE_URL = "https://vqdpahsrwtaccjozuchj.supabase.co"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
AI_FORM_FREE_COMPLETIONS = "1"

[env.prod]
name = "form-assistant-service-prod"
minify = true

[env.prod.observability]
enabled = true
head_sampling_rate = 1

[env.prod.vars]
ENVIRONMENT = "prod"
SUPABASE_URL = "https://qgzzpufyjczgvvggvrhh.supabase.co"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
AI_FORM_FREE_COMPLETIONS = "1"
