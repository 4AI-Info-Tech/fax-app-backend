name = "form-assistant-service"
main = "src/form-assistant.js"
compatibility_date = "2025-07-04"
compatibility_flags = ["nodejs_compat"]
send_metrics = true
minify = false
workers_dev = false

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
SUPABASE_URL = "https://vqdpahsrwtaccjozuchj.supabase.co"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
AI_FORM_FREE_COMPLETIONS = "1"
OPENAI_MODEL = "gpt-4.1-mini"
OPENAI_API_BASE_URL = "https://api.openai.com/v1"
REVENUECAT_API_BASE_URL = "https://api.revenuecat.com/v2"
REVENUECAT_TIMEOUT_MS = "10000"
REVENUECAT_FREE_CURRENCY_CODES = "FreeCredit,free_credits"
REVENUECAT_PRO_CURRENCY_CODES = "ProCredit,pro_credits"

[env.staging]
name = "form-assistant-service-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
ENVIRONMENT = "staging"
SUPABASE_URL = "https://vqdpahsrwtaccjozuchj.supabase.co"
REVENUECAT_PROJECT_ID = "proj7a20ca10"
AI_FORM_FREE_COMPLETIONS = "1"
OPENAI_MODEL = "gpt-4.1-mini"
OPENAI_API_BASE_URL = "https://api.openai.com/v1"
REVENUECAT_API_BASE_URL = "https://api.revenuecat.com/v2"
REVENUECAT_TIMEOUT_MS = "10000"
REVENUECAT_FREE_CURRENCY_CODES = "FreeCredit,free_credits"
REVENUECAT_PRO_CURRENCY_CODES = "ProCredit,pro_credits"

[env.prod]
name = "form-assistant-service-prod"
minify = true

[env.prod.observability]
enabled = true
head_sampling_rate = 1

[env.prod.vars]
